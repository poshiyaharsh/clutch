services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["1433:1433"]
    volumes: [dbdata:/var/opt/mssql]
  web:
    build: .
    depends_on: [db]
    env_file: .env
    environment:
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=ClutchDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
    ports: ["8080:8080"]
volumes:
  dbdata:
